[project]
name = "saathi-voice-service"
version = "0.1.0"
description = "Pipecat real-time voice and Exotel transport for Saathi"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pipecat-ai[groq,runner,sarvam,silero,websocket]==1.7.0",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
